name: APEX AI Code Mentor

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mentor/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    timeout-minutes: 2  # Hardware Watchdog: ubija zadanie po max 2 minutach

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Run AI Mentor Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, subprocess, urllib.request, datetime

          # 1. Pobranie opisu commita oraz zmian (git diff)
          commit_msg = subprocess.check_output(["git", "log", "-1", "--pretty=%B"]).decode("utf-8", errors="ignore").strip()
          try:
              diff_text = subprocess.check_output(["git", "diff", "HEAD~1", "HEAD", "--", ".", ":!mentor", ":!.github"]).decode("utf-8", errors="ignore")
          except Exception:
              diff_text = "Pierwszy commit lub zmiana struktury plików."

          diff_short = diff_text[:4000]

          # 2. Odczyt pamięci długoterminowej ucznia
          log_path = "mentor/mentor_log.json"
          if os.path.exists(log_path):
              with open(log_path, "r", encoding="utf-8") as f:
                  history = json.load(f)
          else:
              history = []

          last_entries = history[-3:]

          # 3. Konstrukcja promptu dla Mentora
          prompt = f"""Jesteś przyjaznym, inżynierskim Mentorem AI dla 11-letniego programisty Bartka (Akademia APEX).
          Przeanalizuj jego najnowszy commit na stronie internetowej i napisz krótką, wspierającą informację zwrotną po polsku (maksymalnie 3-4 krótkie zdania).
          
          Ostatnia historia postępów: {json.dumps(last_entries, ensure_ascii=False)}
          Wiadomość commita: {commit_msg}
          Zmiany w kodzie (diff):
          {diff_short}
          
          Zwróć odpowiedź WYŁĄCZNIE jako czysty obiekt JSON (bez znaczników markdown ```json) o dokładnie takiej strukturze:
          {{
            "pochwala": "Konkretna pochwała za to, co zrobił w tym commicie",
            "wskazowka": "Jedna mała, praktyczna wskazówka rozwojowa na kolejny krok",
            "ocena_etapu": "Krótkie hasło statusowe, np. Czysty Kod!"
          }}"""

          # 4. Wywołanie Gemini API z wyłączonym trybem myślenia (thinkingBudget: 0) i twardym timeoutem 25s
          api_key = os.environ["GEMINI_API_KEY"]
          url = f"https://googleapis.com{api_key}"
          
          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {
                  "temperature": 0.4,
                  "thinkingConfig": {
                      "thinkingBudget": 0
                  }
              }
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

          with urllib.request.urlopen(req, timeout=25) as resp:
              result = json.loads(resp.read().decode("utf-8"))

          raw_text = result["candidates"][0]["content"]["parts"][0]["text"].strip()
          if raw_text.startswith("```"):
              raw_text = raw_text.strip("`").replace("json\n", "", 1).strip()

          mentor_reply = json.loads(raw_text)
          now_str = datetime.datetime.now().strftime("%Y-%m-%d %H:%M")

          # 5. Zapis aktualnego statusu na stronę główną
          status_data = {
              "data": now_str,
              "commit": commit_msg,
              "pochwala": mentor_reply.get("pochwala", "Świetna robota nad kodem!"),
              "wskazowka": mentor_reply.get("wskazowka", "Sprawdź, jak strona wygląda na telefonie."),
              "ocena_etapu": mentor_reply.get("ocena_etapu", "Kod zaktualizowany!")
          }
          with open("mentor/status_ai.json", "w", encoding="utf-8") as f:
              json.dump(status_data, f, ensure_ascii=False, indent=2)

          # 6. Dopisanie wpisu do pamięci długoterminowej (max 20 ostatnich wpisów)
          history.append(status_data)
          history = history[-20:]
          with open(log_path, "w", encoding="utf-8") as f:
              json.dump(history, f, ensure_ascii=False, indent=2)
          EOF

      - name: Commit and Push Mentor Feedback
        run: |
          git config user.name "APEX AI Mentor"
          git config user.email "mentor@apex-academy.local"
          git add mentor/status_ai.json mentor/mentor_log.json
          git commit -m "🤖 Aktualizacja statusu AI Mentora [skip ci]" || exit 0
          git push
