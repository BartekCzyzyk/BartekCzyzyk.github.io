name: APEX AI Code Mentor

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'mentor/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  analyze-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Pobierz repozytorium z historią
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Wyciągnij zmiany z ostatniego commita (git diff)
        id: diff
        run: |
          git diff HEAD~1 HEAD -- . ':(exclude)*.jpg' ':(exclude)*.png' ':(exclude)*.webp' > diff.txt || true
          head -c 8000 diff.txt > diff_trimmed.txt

      - name: Analiza kodu przez AI Mentora (Python)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - << 'EOF'
          import os, json, urllib.request
          from datetime import datetime

          api_key = os.environ.get("GEMINI_API_KEY")
          if not api_key:
              print("Brak klucza GEMINI_API_KEY - przerywam.")
              exit(1)

          with open("diff_trimmed.txt", "r", encoding="utf-8", errors="ignore") as f:
              diff_content = f.read().strip()

          if not diff_content:
              print("Brak zmian tekstowych do analizy.")
              exit(0)

          with open("mentor/mentor_log.json", "r", encoding="utf-8") as f:
              mentor_log = json.load(f)

          today = datetime.now().strftime("%d.%m.%Y")
          today_iso = datetime.now().strftime("%Y-%m-%d")

          prompt = f"""Jesteś wspierającym, partnerskim AI Code Mentorem w Akademii APEX.
          Oceniasz postępy ucznia (Bartek, 5 klasa SP) na podstawie jego najnowszego commita (git diff) oraz dotychczasowej historii nauki.
          Mów do niego jak starszy kolega programista – konkretnie, z szacunkiem, budując poczucie sprawczości (zasada Feedback Sandwich).

          HISTORIA UCZNIA (mentor_log.json):
          {json.dumps(mentor_log, ensure_ascii=False)}

          OSTATNIE ZMIANY W KODZIE (git diff):
          {diff_content}

          Zwróć WYŁĄCZNIE poprawny obiekt JSON o dokładnie takich kluczach (bez znaczników markdown):
          {{
            "data": "{today}",
            "projekt": "Krótka nazwa obszaru/projektu, nad którym pracował uczeń",
            "pochwala": "2-3 zdania konkretnej pochwały za to, co zrobiono dobrze w tym commicie (odnieś się do konkretnego kodu lub zastosowania wcześniejszej wskazówki)",
            "wskazowka": "1-2 zdania konstruktywnej, jednej małej wskazówki na kolejny krok",
            "odznaka": "Krótki tytuł odznaki z emoji na końcu, np. Mistrz Logiki JS 🚀",
            "podsumowanie_do_logu": "1 zdanie podsumowania do historii nauki"
          }}"""

          url = f"https://googleapis.com{api_key}"
          payload = {
              "contents": [{"parts": [{"text": prompt}]}],
              "generationConfig": {"responseMimeType": "application/json"}
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"}
          )

                   import urllib.error
          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
                  first_candidate = next(iter(result["candidates"]))
                  first_part = next(iter(first_candidate["content"]["parts"]))
                  raw_text = first_part["text"]
                  ai_data = json.loads(raw_text)
          except urllib.error.HTTPError as e:
              print("Błąd HTTP z API Gemini:", e.code, e.read().decode("utf-8"))
              exit(1)


          status_payload = {
              "data": ai_data["data"],
              "projekt": ai_data["projekt"],
              "pochwala": ai_data["pochwala"],
              "wskazowka": ai_data["wskazowka"],
              "odznaka": ai_data["odznaka"]
          }

          with open("mentor/status_ai.json", "w", encoding="utf-8") as f:
              json.dump(status_payload, f, ensure_ascii=False, indent=2)

          mentor_log["ostatnia_aktualizacja"] = today_iso
          mentor_log["historia_sesji"].append({
              "data": today_iso,
              "projekt": ai_data["projekt"],
              "podsumowanie": ai_data["podsumowanie_do_logu"],
              "wskazowka_do_weryfikacji": ai_data["wskazowka"]
          })
          mentor_log["historia_sesji"] = mentor_log["historia_sesji"][-15:]

          with open("mentor/mentor_log.json", "w", encoding="utf-8") as f:
              json.dump(mentor_log, f, ensure_ascii=False, indent=2)
          EOF

      - name: Zapisz wynik analizy w repozytorium
        run: |
          git config user.name "APEX AI Mentor"
          git config user.email "mentor@akademia-apex.pl"
          git add mentor/status_ai.json mentor/mentor_log.json
          git diff --staged --quiet || git commit -m "🤖 Aktualizacja statusu AI Mentora"
          git push
