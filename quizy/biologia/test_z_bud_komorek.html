<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trener Biologii – Budowa Komórki | Bartek Czyżyk</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { color: #56d364; text-align: center; font-size: 1.6rem; margin-top: 0; }
        .subtitle { text-align: center; color: #8b949e; font-size: 0.95rem; margin-bottom: 20px; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #0d1117;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .question-box { font-size: 1.15rem; font-weight: 600; margin-bottom: 20px; line-height: 1.5; color: #f0f6fc; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) { background-color: #30363d; border-color: #58a6ff; }
        .option-btn.correct { background-color: rgba(46, 160, 67, 0.25); border-color: #3fb950; color: #56d364; font-weight: bold; }
        .option-btn.wrong { background-color: rgba(248, 81, 73, 0.25); border-color: #f85149; color: #ff7b72; }
        .feedback { margin-top: 18px; padding: 14px; border-radius: 8px; display: none; font-size: 0.95rem; line-height: 1.4; }
        .next-btn, .restart-btn, .back-btn {
            margin-top: 20px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .next-btn:hover, .restart-btn:hover { background-color: #2ea043; }
        .back-btn { background-color: #21262d; border: 1px solid #30363d; margin-top: 12px; }
        .back-btn:hover { background-color: #30363d; }
        .result-screen { text-align: center; display: none; }
        .score-big { font-size: 2.5rem; color: #56d364; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🧬 Trener Biologii: Budowa Komórki</h1>
    <div class="subtitle">Komórka zwierzęca, roślinna, grzybowa i bakteryjna</div>
    <div id="quiz-area">
        <div class="stats-bar">
            <span id="progress-text">Pytanie: 1 / 25</span>
            <span id="score-text" style="color: #56d364;">Punkty: 0</span>
        </div>
        <div class="question-box" id="question-text">Ładowanie pytania...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="feedback-box"></div>
        <button class="next-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">Następne pytanie ➡️</button>
    </div>
    <div class="result-screen" id="result-area">
        <h2>🎉 Trening zakończony!</h2>
        <div class="score-big" id="final-score">0 / 25</div>
        <p id="result-comment" style="font-size: 1.1rem; margin-bottom: 25px;"></p>
        <button class="restart-btn" onclick="restartQuiz()">🔄 Zagraj jeszcze raz (Losowa kolejność)</button>
        <a href="index.html" class="back-btn">🏠 Powrót na stronę główną</a>
    </div>

<!----------------- LINK DO STRONY SZKOLY ------------------->
 <footer style="margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); text-align: center; font-size: 0.85rem; color: var(--muted);">

<script>
const questionsData = [

    {
        q: "Które trzy elementy komórki zwierzęcej można zobaczyć pod mikroskopem optycznym już przy powiększeniu 400 razy?",
        options: ["Błonę komórkową, cytoplazmę i jądro komórkowe", "Mitochondria, rybosomy i wakuole", "Ścianę komórkową, chloroplasty i cytozol", "Aparat Golgiego, siateczkę śródplazmatyczną i nić DNA"],
        correct: 0,
        info: "Przy powiększeniu 400x widzimy tylko błonę komórkową, cytoplazmę i jądro. Pozostałe organelle wymagają powiększenia ok. 10 tys. razy."
    },
    {
        q: "Jaką funkcję pełni błona komórkowa?",
        options: ["Oddziela wnętrze komórki od otoczenia i transportuje różne substancje", "Wytwarza energię potrzebną do życia komórki", "Przeprowadza proces fotosyntezy", "Nadaje komórce zwierzęcej sztywny, prostokątny kształt"],
        correct: 0,
        info: "Błona komórkowa występuje we wszystkich rodzajach komórek (zwierzęcej, roślinnej, grzybowej i bakteryjnej)."
    },
    {
        q: "Czym jest cytozol?",
        options: ["Galaretowatą substancją wypełniającą komórkę (woda, sole mineralne, białka)", "Zielonym barwnikiem pochłaniającym światło", "Cukrem budującym ścianę komórkową grzybów", "Pęcherzykiem trawiącym substancje w komórce zwierzęcej"],
        correct: 0,
        info: "Cytozol razem z zawieszonymi w nim organellami tworzy cytoplazmę."
    },
    {
        q: "Dlaczego mitochondrium nazywamy „centrum energetycznym komórki”?",
        options: ["Ponieważ dostarcza komórce energii", "Ponieważ magazynuje wodę i sole mineralne", "Ponieważ kieruje wszystkimi procesami i zawiera DNA", "Ponieważ wytwarza białka z drobnych ziarenek"],
        correct: 0,
        info: "Mitochondrium ma zwykle owalny kształt i uwalnia energię niezbędną do funkcjonowania komórki."
    },
    {
        q: "Za co odpowiadają rybosomy?",
        options: ["Za wytwarzanie białek", "Za transportowanie tłuszczów", "Za ochronę bakterii przed wysychaniem", "Za utrzymanie odpowiedniej ilości wody w roślinie"],
        correct: 0,
        info: "Rybosomy mają wygląd drobnych ziarenek i występują we wszystkich czterech typach komórek."
    },
    {
        q: "Gdzie w komórce jądrowej znajduje się DNA i który element kieruje wszystkimi procesami w komórce?",
        options: ["W jądrze komórkowym", "W aparacie Golgiego", "W wakuoli (wodniczce)", "W ścianie komórkowej"],
        correct: 0,
        info: "Jądro komórkowe ma zwykle kulisty kształt i leży w środkowej części komórki zwierzęcej."
    },
    {
        q: "Jaką funkcję pełni aparat Golgiego?",
        options: ["Przekształca i transportuje białka", "Przeprowadza fotosyntezę", "Umożliwia ruch komórce bakteryjnej", "Chroni przed wnikaniem drobnoustrojów chorobotwórczych"],
        correct: 0,
        info: "Aparat Golgiego ma postać stosu przylegających do siebie, spłaszczonych pęcherzy i drobnych pęcherzyków."
    },
    {
        q: "Czym jest siateczka śródplazmatyczna i do czego służy?",
        options: ["To system cienkich kanalików uczestniczący w wytwarzaniu i transportowaniu białek oraz tłuszczów", "To sztywna osłona zbudowana z celulozy", "To duży pęcherz wypełniony wodą w komórce roślinnej", "To miejsce występowania zielonego barwnika chlorofilu"],
        correct: 0,
        info: "Siateczka śródplazmatyczna oplata jądro komórkowe i rozciąga się w całej komórce."
    },
    {
        q: "Które dwa elementy odróżniają komórkę roślinną od komórki zwierzęcej?",
        options: ["Ściana komórkowa oraz chloroplasty", "Mitochondria oraz rybosomy", "Błona komórkowa oraz cytozol", "Jądro komórkowe oraz wakuole"],
        correct: 0,
        info: "Komórka zwierzęca nigdy nie ma ściany komórkowej ani chloroplastów."
    },
    {
        q: "Z jakiego głównego cukru zbudowana jest ściana komórkowa roślin?",
        options: ["Z celulozy", "Z chityny", "Z glukozy", "Ze skrobi"],
        correct: 0,
        info: "Ściana komórkowa roślin zbudowana jest z celulozy, natomiast u grzybów – z chityny."
    },
    {
        q: "Jaką funkcję pełni ściana komórkowa w komórce roślinnej?",
        options: ["Nadaje kształt, chroni przed uszkodzeniami i zabezpiecza przed drobnoustrojami chorobotwórczymi", "Wytwarza substancje pokarmowe podczas fotosyntezy", "Dostarcza energii z rozkładu pokarmu", "Uczestniczy w trawieniu zbędnych substancji"],
        correct: 0,
        info: "Ściana komórkowa znajduje się na zewnątrz błony komórkowej."
    },
    {
        q: "Jaki zielony barwnik znajduje się w chloroplastach i jaka jest ich funkcja?",
        options: ["Chlorofil – wytwarzanie substancji pokarmowych podczas fotosyntezy", "Cytozol – magazynowanie wody", "Chityna – ochrona przed wysychaniem", "Celuloza – transportowanie białek"],
        correct: 0,
        info: "Chloroplasty mają najczęściej owalny kształt i występują tylko w komórkach roślinnych."
    },
    {
        q: "Czym różni się wakuola (wodniczka) w komórce roślinnej od tej w komórce zwierzęcej?",
        options: ["W roślinnej jest zwykle pojedyncza i duża (utrzymuje wodę), a w zwierzęcej jest wiele drobnych wakuol", "W roślinnej odpowiada za trawienie, a w zwierzęcej przeprowadza fotosyntezę", "W komórce roślinnej w ogóle nie ma wakuoli", "W komórce zwierzęcej jedna wielka wakuola zajmuje środek komórki"],
        correct: 0,
        info: "Duża wakuola w komórce roślinnej zapewnia utrzymanie odpowiedniej ilości wody (jędrność rośliny)."
    },
    {
        q: "Jaka popularna roślina wodna służy w szkolnym laboratorium do obserwacji komórek roślinnych pod mikroskopem?",
        options: ["Moczarka kanadyjska", "Paprotka zwyczajna", "Lilia wodna", "Rzęsa wodna"],
        correct: 0,
        info: "Liście moczarki kanadyjskiej są bardzo cienkie i świetnie widać w nich ściany komórkowe oraz chloroplasty."
    },
    {
        q: "Co jest najbardziej charakterystyczną cechą budowy komórki bakteryjnej?",
        options: ["Brak jądra komórkowego (jego funkcję pełni nić DNA w cytozolu)", "Obecność wielu dużych chloroplastów", "Brak błony komórkowej i rybosomów", "Ściana komórkowa zbudowana z celulozy"],
        correct: 0,
        info: "Bakterie należą do komórek bezjądrowych – ich DNA pływa swobodnie w cytozolu."
    },
    {
        q: "Jaką funkcję pełni otoczka śluzowa występująca u niektórych bakterii?",
        options: ["Chroni komórkę przed wysychaniem", "Umożliwia aktywne pływanie w wodzie", "Wytwarza energię dla bakterii", "Przeprowadza fotosyntezę"],
        correct: 0,
        info: "Otoczka śluzowa leży na zewnątrz ściany komórkowej bakterii."
    },
    {
        q: "Dzięki czemu część komórek bakteryjnych może się poruszać?",
        options: ["Dzięki rzęskom", "Dzięki wakuolom", "Dzięki aparatom Golgiego", "Dzięki siateczce śródplazmatycznej"],
        correct: 0,
        info: "Rzęski działają jak małe napędowe wici, pozwalając bakteriom przemieszczać się w środowisku."
    },
    {
        q: "Z jakiego cukru zbudowana jest ściana komórkowa grzybów?",
        options: ["Z chityny", "Z celulozy", "Z chlorofilu", "Z cytozolu"],
        correct: 0,
        info: "Komórka grzybowa przypomina komórkę zwierzęcą, ale ma dodatkowo ścianę komórkową z chityny."
    },
    {
        q: "Czy komórka grzybowa posiada chloroplasty?",
        options: ["Nie, komórki grzybowe nie mają chloroplastów", "Tak, ma ich nawet więcej niż roślina", "Tak, ale tylko w kapeluszu grzyba", "Tak, służą jej do trawienia drewna"],
        correct: 0,
        info: "Grzyby są cudzożywne (nie przeprowadzają fotosyntezy), więc nie posiadają chloroplastów."
    },
    {
        q: "Które z poniższych organelli NIE występuje w komórce bakteryjnej?",
        options: ["Mitochondrium i wakuola", "Błona komórkowa i cytozol", "Rybosomy i ściana komórkowa", "Nić DNA"],
        correct: 0,
        info: "Komórka bakteryjna nie ma jądra, mitochondriów, wakuoli ani chloroplastów."
    },
    {
        q: "Które trzy składniki występują we WSZYSTKICH czterech typach komórek (zwierzęcej, roślinnej, grzybowej i bakteryjnej)?",
        options: ["Błona komórkowa, cytozol i rybosomy", "Jądro komórkowe, mitochondria i wakuola", "Ściana komórkowa, błona komórkowa i jądro", "Cytozol, chloroplasty i rybosomy"],
        correct: 0,
        info: "W tabeli na str. 37 tylko błona komórkowa, cytozol i rybosomy występują we wszystkich 4 rodzajach komórek."
    },
    {
        q: "Jak wygląda wakuola w komórce grzybowej według tabeli porównawczej?",
        options: ["Może być pojedyncza, duża lub może być wiele drobnych wakuol", "W komórce grzybowej wakuola w ogóle nie występuje", "Zawsze jest tylko jedna, ogromna wakuola", "Zastępuje ją otoczka śluzowa"],
        correct: 0,
        info: "U grzybów występuje albo pojedyncza duża wakuola, albo wiele drobnych."
    },
    {
        q: "Które komórki zaliczamy do komórek jądrowych?",
        options: ["Zwierzęce, roślinne i grzybowe", "Tylko zwierzęce i roślinne", "Wszystkie oprócz roślinnych", "Tylko bakteryjne"],
        correct: 0,
        info: "Komórki zwierzęce, roślinne i grzybowe mają jądro komórkowe (są jądrowe), a bakteryjne są bezjądrowe."
    },
    {
        q: "Jaki kształt mają komórki w rzeczywistości, mimo że pod mikroskopem widzimy ich płaski obraz?",
        options: ["Budowę przestrzenną (3D)", "Zawsze idealnie płaski jak kartka papieru", "Wyłącznie kształt sześcianu", "Zmieniają kształt z płaskiego na kulisty tylko w nocy"],
        correct: 0,
        info: "Mikroskop optyczny daje płaski obraz przekroju, ale w rzeczywistości każda komórka jest obiektem przestrzennym."
    },
    {
        q: "W których komórkach występuje ściana komórkowa?",
        options: ["W roślinnych, grzybowych i bakteryjnych", "Tylko w roślinnych", "W zwierzęcych i roślinnych", "We wszystkich czterech rodzajach komórek"],
        correct: 0,
        info: "Jedyną komórką z tej czwórki, która NIE ma ściany komórkowej, jest komórka zwierzęca."
    }
];
let currentQuestions = [];
let currentIndex = 0;
let score = 0;

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function startQuiz() {
    currentQuestions = shuffle([...questionsData]);
    currentIndex = 0;
    score = 0;
    document.getElementById("result-area").style.display = "none";
    document.getElementById("quiz-area").style.display = "block";
    showQuestion();
}

function showQuestion() {
    const qObj = currentQuestions[currentIndex];
    document.getElementById("progress-text").innerText = `Pytanie: ${currentIndex + 1} / ${currentQuestions.length}`;
    document.getElementById("score-text").innerText = `Punkty: ${score}`;
    document.getElementById("question-text").innerText = qObj.q;
    
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.style.display = "none";
    document.getElementById("next-btn").style.display = "none";

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    let optionsWithIndex = qObj.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qObj.correct }));
    optionsWithIndex = shuffle(optionsWithIndex);

    optionsWithIndex.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.text;
        btn.onclick = () => selectAnswer(btn, opt.isCorrect, qObj.info);
        optionsContainer.appendChild(btn);
    });
}

function selectAnswer(selectedBtn, isCorrect, infoText) {
    document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.style.display = "block";

    if (isCorrect) {
        selectedBtn.classList.add("correct");
        score++;
        document.getElementById("score-text").innerText = `Punkty: ${score}`;
        feedbackBox.style.backgroundColor = "rgba(46, 160, 67, 0.15)";
        feedbackBox.style.border = "1px solid #3fb950";
        feedbackBox.innerHTML = `✅ <strong>Świetnie!</strong> ${infoText}`;
    } else {
        selectedBtn.classList.add("wrong");
        feedbackBox.style.backgroundColor = "rgba(248, 81, 73, 0.15)";
        feedbackBox.style.border = "1px solid #f85149";
        feedbackBox.innerHTML = `❌ <strong>Błąd!</strong> ${infoText}`;
    }
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) showQuestion();
    else showResults();
}

function showResults() {
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${currentQuestions.length}`;

    const comment = document.getElementById("result-comment");
    if (score === currentQuestions.length) comment.innerText = "🏆 PERFEKCYJNIE! Masz szóstkę ze sprawdzianu w kieszeni!";
    else if (score >= 20) comment.innerText = "🔥 Świetny wynik! Jeszcze jedno podejście i będzie 100%!";
    else comment.innerText = "💪 Dobry start! Przeczytaj podpowiedzi przy błędach i spróbuj jeszcze raz.";
}

function restartQuiz() { startQuiz(); }
startQuiz();
</script>
</body>
</html>
