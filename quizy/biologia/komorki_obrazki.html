<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trener Obrazkowy: Budowa Komórki | Bartek Czyżyk</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 700px;
            width: 100%;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 { color: #56d364; text-align: center; font-size: 1.5rem; margin-top: 0; }
        .subtitle { text-align: center; color: #8b949e; font-size: 0.95rem; margin-bottom: 18px; }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: #0d1117;
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #30363d;
            margin-bottom: 18px;
            font-weight: bold;
        }
        .img-wrapper {
            background-color: #ffffff;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 18px;
            text-align: center;
            border: 2px solid #30363d;
        }
        .img-wrapper img {
            max-width: 100%;
            max-height: 260px;
            border-radius: 6px;
            object-fit: contain;
        }
        .question-box { font-size: 1.15rem; font-weight: 600; margin-bottom: 18px; line-height: 1.5; color: #f0f6fc; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 14px 18px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:hover:not(:disabled) { background-color: #30363d; border-color: #58a6ff; }
        .option-btn.correct { background-color: rgba(46, 160, 67, 0.25); border-color: #3fb950; color: #56d364; font-weight: bold; }
        .option-btn.wrong { background-color: rgba(248, 81, 73, 0.25); border-color: #f85149; color: #ff7b72; }
        .feedback { margin-top: 18px; padding: 14px; border-radius: 8px; display: none; font-size: 0.95rem; line-height: 1.4; }
        .next-btn, .restart-btn, .back-btn {
            margin-top: 18px;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
        }
        .next-btn:hover, .restart-btn:hover { background-color: #2ea043; }
        .back-btn { background-color: #21262d; border: 1px solid #30363d; margin-top: 12px; }
        .back-btn:hover { background-color: #30363d; }
        .result-screen { text-align: center; display: none; }
        .score-big { font-size: 2.5rem; color: #56d364; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
<div class="container">
    <h1>🔬 Trener Obrazkowy: Budowa Komórki</h1>
    <div class="subtitle">Rozpoznaj strukturę na ilustracji i odpowiedz na pytanie</div>

    <div id="quiz-area">
        <div class="stats-bar">
            <span id="progress-text">Pytanie: 1 / 10</span>
            <span id="score-text" style="color: #56d364;">Punkty: 0</span>
        </div>
        <div class="img-wrapper">
            <img id="question-img" src="" alt="Ilustracja biologiczna">
        </div>
        <div class="question-box" id="question-text">Ładowanie pytania...</div>
        <div class="options-grid" id="options-container"></div>
        <div class="feedback" id="feedback-box"></div>
        <button class="next-btn" id="next-btn" style="display: none;" onclick="nextQuestion()">Następne pytanie ➡️</button>
    </div>

    <div class="result-screen" id="result-area">
        <h2>🎉 Trening wizualny zakończony!</h2>
        <div class="score-big" id="final-score">0 / 10</div>
        <p id="result-comment" style="font-size: 1.1rem; margin-bottom: 25px;"></p>
        <button class="restart-btn" onclick="restartQuiz()">🔄 Zagraj jeszcze raz (Losowa kolejność)</button>
        <a href="../../index.html" class="back-btn">🏠 Powrót na stronę główną</a>
    </div>
</div>
<!----------------- LINK DO STRONY SZKOLY ------------------->
 <footer style="margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border); text-align: center; font-size: 0.85rem; color: var(--muted);">
        🚀 Aplikacja stworzona przez <strong>Bartka</strong> w ramach programu 
        <a href="https://wojciechczyzyk.github.io/sarenka/" target="_blank" style="color: #56D364; text-decoration: none; font-weight: bold;">
            Akademia APEX • Sarenka Software Kids
        </a>
    </footer>
    
<script>
const questionsData = [
    {
        img: "komorka_zwierzeca.jpg",
        q: "Jaki rodzaj komórki przedstawia powyższa ilustracja?",
        options: ["Komórkę zwierzęcą", "Komórkę roślinną", "Komórkę bakteryjną", "Komórkę grzybową"],
        correct: 0,
        info: "To komórka zwierzęca – ma kuliste jądro w środku, siateczkę śródplazmatyczną i mitochondria, ale nie ma ściany komórkowej ani chloroplastów."
    },
    {
        img: "komorka_zwierzeca.jpg",
        q: "Spójrz na fioletową kulę w samym centrum tej komórki. Jaka jest jej główna funkcja?",
        options: ["Zawiera DNA i kieruje wszystkimi procesami w komórce", "Przeprowadza proces fotosyntezy", "Chroni komórkę przed wysychaniem", "Magazynuje wodę i sole mineralne"],
        correct: 0,
        info: "Fioletowa struktura to jądro komórkowe – centrum dowodzenia komórki jądrowej zawierające materiał genetyczny (DNA)."
    },
    {
        img: "komorka_roslinna.jpg",
        q: "Po czym najłatwiej rozpoznać, że na ilustracji znajduje się komórka roślinna?",
        options: ["Po grubej ścianie komórkowej, zielonych chloroplastach i wielkiej niebieskiej wakuoli", "Po obecności długiej rzęski do pływania", "Po całkowitym braku jądra komórkowego", "Po ścianie zbudowanej z chityny"],
        correct: 0,
        info: "Komórka roślinna ma sztywną ścianę komórkową z celulozy, zielone chloroplasty oraz jedną dużą wakuolę wypełnioną wodą."
    },
    {
        img: "komorka_roslinna.jpg",
        q: "Jaką funkcję pełnią widoczne na rysunku zielone, owalne organelle (chloroplasty)?",
        options: ["Wytwarzają substancje pokarmowe podczas fotosyntezy", "Dostarczają komórce energii z rozkładu pokarmu", "Wytwarzają białka", "Transportują tłuszcze"],
        correct: 0,
        info: "Chloroplasty zawierają zielony barwnik (chlorofil), który umożliwia przeprowadzanie fotosyntezy."
    },
    {
        img: "komorka_bakteryjna.jpg",
        q: "Jaki organizm ma komórkę o budowie widocznej na powyższym rysunku?",
        options: ["Bakteria", "Grzyb kapeluszowy", "Roślina wodna", "Zwierzę kręgowe"],
        correct: 0,
        info: "To komórka bakteryjna – rozpoznasz ją po braku jądra komórkowego (luźna nić DNA w środku), otoczce śluzowej i rzęsce."
    },
    {
        img: "komorka_bakteryjna.jpg",
        q: "Jaką rolę pełni splątana fioletowa nić widoczna w centralnej części tej komórki bakteryjnej?",
        options: ["Jest to nić DNA, która zastępuje jądro komórkowe", "To mitochondrium wytwarzające energię", "To aparat Golgiego pakujący białka", "To wakuola magazynująca wodę"],
        correct: 0,
        info: "Bakterie są komórkami bezjądrowymi – ich materiał genetyczny (nić DNA) pływa bezpośrednio w cytozolu."
    },
    {
        img: "mitochondrium.jpg",
        q: "Jak nazywa się to organellum przypominające fasolkę z pofałdowaną błoną w środku?",
        options: ["Mitochondrium", "Chloroplast", "Rybosom", "Wakuola (wodniczka)"],
        correct: 0,
        info: "To mitochondrium – występuje w komórkach zwierzęcych, roślinnych i grzybowych (nie ma go tylko u bakterii)."
    },
    {
        img: "mitochondrium.jpg",
        q: "Dlaczego struktura widoczna na obrazku (mitochondrium) jest nazywana „elektrownią” komórki?",
        options: ["Ponieważ uwalnia i dostarcza komórce energii potrzebnej do życia", "Ponieważ pochłania światło słoneczne", "Ponieważ nadaje komórce sztywny kształt", "Ponieważ kieruje podziałem komórki"],
        correct: 0,
        info: "Mitochondrium to centrum energetyczne komórki – bez niego komórka jądrowa nie miałaby energii do działania."
    },
    {
        img: "aparat_golgiego.jpg",
        q: "Jaka struktura komórkowa została przedstawiona na tej ilustracji?",
        options: ["Aparat Golgiego", "Siateczka śródplazmatyczna", "Ściana komórkowa", "Otoczka śluzowa"],
        correct: 0,
        info: "Aparat Golgiego ma postać stosu spłaszczonych woreczków, od których odrywają się drobne pęcherzyki transportowe."
    },
    {
        img: "aparat_golgiego.jpg",
        q: "Za co odpowiada widoczny na obrazku aparat Golgiego?",
        options: ["Przekształca i transportuje białka", "Magazynuje wodę w komórce roślinnej", "Umożliwia ruch komórce bakteryjnej", "Chroni przed drobnoustrojami chorobotwórczymi"],
        correct: 0,
        info: "Aparat Golgiego działa jak komórkowa poczta – odbiera białka, modyfikuje je i wysyła w pęcherzykach tam, gdzie są potrzebne."
    }
];

let currentQuestions = [];
let currentIndex = 0;
let score = 0;

function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

function startQuiz() {
    currentQuestions = shuffle([...questionsData]);
    currentIndex = 0;
    score = 0;
    document.getElementById("result-area").style.display = "none";
    document.getElementById("quiz-area").style.display = "block";
    showQuestion();
}

function showQuestion() {
    const qObj = currentQuestions[currentIndex];
    document.getElementById("progress-text").innerText = `Pytanie: ${currentIndex + 1} / ${currentQuestions.length}`;
    document.getElementById("score-text").innerText = `Punkty: ${score}`;
    document.getElementById("question-img").src = qObj.img;
    document.getElementById("question-text").innerText = qObj.q;
    
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.style.display = "none";
    document.getElementById("next-btn").style.display = "none";

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    let optionsWithIndex = qObj.options.map((opt, idx) => ({ text: opt, isCorrect: idx === qObj.correct }));
    optionsWithIndex = shuffle(optionsWithIndex);

    optionsWithIndex.forEach(opt => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.innerText = opt.text;
        btn.onclick = () => selectAnswer(btn, opt.isCorrect, qObj.info);
        optionsContainer.appendChild(btn);
    });
}

function selectAnswer(selectedBtn, isCorrect, infoText) {
    document.querySelectorAll(".option-btn").forEach(btn => btn.disabled = true);
    const feedbackBox = document.getElementById("feedback-box");
    feedbackBox.style.display = "block";

    if (isCorrect) {
        selectedBtn.classList.add("correct");
        score++;
        document.getElementById("score-text").innerText = `Punkty: ${score}`;
        feedbackBox.style.backgroundColor = "rgba(46, 160, 67, 0.15)";
        feedbackBox.style.border = "1px solid #3fb950";
        feedbackBox.innerHTML = `✅ <strong>Świetnie!</strong> ${infoText}`;
    } else {
        selectedBtn.classList.add("wrong");
        feedbackBox.style.backgroundColor = "rgba(248, 81, 73, 0.15)";
        feedbackBox.style.border = "1px solid #f85149";
        feedbackBox.innerHTML = `❌ <strong>Błąd!</strong> ${infoText}`;
    }
    document.getElementById("next-btn").style.display = "block";
}

function nextQuestion() {
    currentIndex++;
    if (currentIndex < currentQuestions.length) showQuestion();
    else showResults();
}

function showResults() {
    document.getElementById("quiz-area").style.display = "none";
    document.getElementById("result-area").style.display = "block";
    document.getElementById("final-score").innerText = `${score} / ${currentQuestions.length}`;

    const comment = document.getElementById("result-comment");
    if (score === currentQuestions.length) comment.innerText = "🏆 MISTRZ MIKROSKOPU! Rozpoznajesz każdą komórkę bezbłędnie!";
    else if (score >= 8) comment.innerText = "🔥 Świetny wynik! Jeszcze jedno podejście i będzie 10/10!";
    else comment.innerText = "💪 Dobry trening! Przyjrzyj się opisom pod obrazkami i spróbuj jeszcze raz.";
}

function restartQuiz() { startQuiz(); }
startQuiz();
</script>
</body>
</html>
