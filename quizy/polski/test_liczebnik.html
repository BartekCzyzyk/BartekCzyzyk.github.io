<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Język Polski (Klasa 5): Liczebnik | Poligon Baty</title>
  <link rel="icon" type="image/png" href="../../favicon_bartek.png">
  <link rel="stylesheet" href="../quiz_style.css">
</head>
<body>
  <div class="container">
    <div style="margin-bottom: 1rem;">
      <a href="../../index.html" class="btn-link">← Wróć na stronę główną Baty</a>
    </div>

    <div class="card" id="quiz-box">
      <span class="tag">🇵🇱 Język Polski • Klasa 5 • Części Mowy</span>
      <h1>Trener: Liczebnik (20 pytań)</h1>

      <div style="display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-weight: bold; color: #58a6ff;">
        <span id="question-counter">Pytanie 1 / 20</span>
        <span id="score-counter">Wynik: 0 pkt</span>
      </div>

      <h2 id="question-text" style="margin-bottom: 16px;">Ładowanie pytania...</h2>
      <div id="answers-container" style="display: flex; flex-direction: column; gap: 10px;"></div>
      <div id="feedback-box" style="display: none;"></div>
      <button id="next-btn" class="btn-link" style="display: none; cursor: pointer;">Następne pytanie ➔</button>
    </div>

    <div class="card" id="result-box" style="display: none;">
      <h2>🏆 Podsumowanie Treningu: Liczebnik</h2>
      <div id="final-score-text"></div>
      <button id="restart-btn" class="btn-link" style="cursor: pointer; margin-top: 10px;">🔄 Zagraj jeszcze raz</button>
    </div>
  </div>

  <script src="liczebnik_pytania.js"></script>
  <script src="../quiz_silnik.js"></script>
  <script src="../quiz_stopka.js"></script>
</body>
</html>
